name: Build Docker Image

on:
  pull_request:
    branches: [ "main" ]
  
permissions:
  contents: read
  packages: write

jobs:
  ci-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
    - name: Run tests
      run: npm test

  build:
    runs-on: ubuntu-latest
    needs: ci-test

    steps:
    - uses: actions/checkout@v6
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag meeting-distance-calculator:$(date +%s)
